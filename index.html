<!-- =========================================
PLANTWIZ PF ANALYSIS REPORT
FINAL LIVE VERSION
========================================= -->

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PF Analysis</title>

<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:#f3f4f7;
    color:#111827;
}

.wrapper{
    width:100%;
    padding:10px;
}

/* ======================================
TOP BAR
====================================== */

.topbar{

    width:100%;

    background:#ffffff;

    border:1px solid #e5e7eb;

    border-radius:10px;

    padding:12px 16px;

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:12px;
}

.topbar label{

    font-size:14px;

    font-weight:600;

    color:#6b7280;
}

.topbar input{

    padding:8px 12px;

    border:1px solid #d1d5db;

    border-radius:8px;

    font-size:14px;
}

.topbar button{

    background:#0b5ed7;

    color:#fff;

    border:none;

    border-radius:8px;

    padding:10px 18px;

    font-weight:700;

    cursor:pointer;
}

.status{
    margin-left:auto;
    color:#6b7280;
    font-size:13px;
}

/* ======================================
KPI CARDS
====================================== */

.kpi-grid{

    width:100%;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:12px;

    margin-bottom:12px;
}

.kpi-card{

    position:relative;

    background:#ffffff;

    border-radius:10px;

    border:1px solid #dfe3e8;

    padding:16px 18px;

    min-height:120px;

    overflow:hidden;
}

.kpi-card::before{

    content:"";

    position:absolute;

    left:0;
    top:0;

    width:4px;
    height:100%;

    background:#10b981;
}

.kpi-card.orange::before{
    background:#f59e0b;
}

.kpi-card.red::before{
    background:#ef4444;
}

.kpi-title{

    font-size:11px;

    letter-spacing:2px;

    text-transform:uppercase;

    color:#94a3b8;

    font-weight:700;

    margin-bottom:10px;
}

.kpi-value{

    font-size:52px;

    font-weight:800;

    line-height:1;

    color:#0f172a;
}

.kpi-unit{

    font-size:18px;

    color:#94a3b8;

    margin-left:4px;
}

.kpi-footer{

    margin-top:12px;

    display:flex;

    align-items:center;

    gap:10px;

    flex-wrap:wrap;
}

.badge{

    background:#dcfce7;

    color:#15803d;

    font-size:11px;

    padding:5px 10px;

    border-radius:6px;

    font-weight:700;
}

.footer-text{

    color:#94a3b8;

    font-size:12px;
}

/* ======================================
PANELS
====================================== */

.panel{

    width:100%;

    background:#ffffff;

    border-radius:10px;

    border:1px solid #e5e7eb;

    padding:14px;

    margin-bottom:12px;
}

.panel h3{

    margin-bottom:12px;

    font-size:18px;

    color:#111827;
}

/* ======================================
TABLE
====================================== */

table{
    width:100%;
    border-collapse:collapse;
}

thead th{

    background:#f8fafc;

    color:#334155;

    padding:12px;

    border-bottom:1px solid #e5e7eb;

    font-size:13px;
}

tbody td{

    padding:12px;

    border-bottom:1px solid #edf2f7;

    text-align:center;

    font-size:13px;
}

tbody tr:nth-child(even){
    background:#fafafa;
}

@media(max-width:1200px){

    .kpi-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:700px){

    .kpi-grid{
        grid-template-columns:1fr;
    }

    .topbar{
        flex-direction:column;
        align-items:flex-start;
    }

    .status{
        margin-left:0;
    }
}

</style>
</head>

<body>

<div class="wrapper">

    <!-- ======================
    TOP BAR
    ======================= -->

    <div class="topbar">

        <label>🟢 Date</label>

        <input type="date" id="dateInput">

        <button onclick="loadData()">
            ▶ Analyze
        </button>

        <div class="status" id="statusText">
            Waiting...
        </div>

    </div>

    <!-- ======================
    KPI
    ======================= -->

    <div class="kpi-grid">

        <div class="kpi-card">

            <div class="kpi-title">
                Average PF
            </div>

            <div>
                <span class="kpi-value" id="avgPF">--</span>
            </div>

            <div class="kpi-footer">

                <div class="badge">
                    ✔ LIVE
                </div>

                <div class="footer-text">
                    Average from telemetry
                </div>

            </div>

        </div>

        <div class="kpi-card orange">

            <div class="kpi-title">
                Minimum PF
            </div>

            <div>
                <span class="kpi-value" id="minPF">--</span>
            </div>

            <div class="kpi-footer">

                <div class="badge">
                    ⚠ LIVE
                </div>

                <div class="footer-text" id="minPFTime">
                    --
                </div>

            </div>

        </div>

        <div class="kpi-card">

            <div class="kpi-title">
                Low PF Duration
            </div>

            <div>
                <span class="kpi-value" id="durationPF">--</span>
                <span class="kpi-unit">Min</span>
            </div>

            <div class="kpi-footer">

                <div class="badge">
                    ✔ LIVE
                </div>

                <div class="footer-text">
                    PF below 0.90
                </div>

            </div>

        </div>

        <div class="kpi-card red">

            <div class="kpi-title">
                Estimated Penalty
            </div>

            <div>
                <span class="kpi-value" id="penaltyPF">--</span>
            </div>

            <div class="kpi-footer">

                <div class="badge">
                    ₹ LIVE
                </div>

                <div class="footer-text">
                    Based on low PF duration
                </div>

            </div>

        </div>

    </div>

    <!-- ======================
    PF TREND
    ======================= -->

    <div class="panel">

        <h3>
            PF Trend With Active Power
        </h3>

        <div id="pfTrend" style="height:420px;"></div>

    </div>

    <!-- ======================
    PF SCATTER
    ======================= -->

    <div class="panel">

        <h3>
            PF vs Active Power
        </h3>

        <div id="pfScatter" style="height:420px;"></div>

    </div>

    <!-- ======================
    EVENT TABLE
    ======================= -->

    <div class="panel">

        <h3>
            Low PF Events
        </h3>

        <table>

            <thead>

                <tr>

                    <th>Start Time</th>
                    <th>End Time</th>
                    <th>Min PF</th>
                    <th>kW @ Min PF</th>
                    <th>Duration</th>

                </tr>

            </thead>

            <tbody id="eventsTable">

                <tr>
                    <td colspan="5">
                        No Data
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

<script>

/* =========================================
CONFIG
========================================= */

const DEVICE_ID =
"1250b550-5bdb-11f0-9b14-15d3b3a473c1";

const JWT_TOKEN =
localStorage.getItem("jwt_token");

/* =========================================
DEFAULT DATE
========================================= */

document.getElementById("dateInput").value =
new Date().toISOString().split('T')[0];

/* =========================================
FORMAT DATE
========================================= */

function formatTime(ts){

    return new Date(ts).toLocaleString();
}

/* =========================================
LOAD DATA
========================================= */

async function loadData(){

    try{

        document.getElementById("statusText").innerHTML =
        "Loading telemetry...";

        const selectedDate =
        document.getElementById("dateInput").value;

        const startTs =
        new Date(selectedDate + "T00:00:00").getTime();

        const endTs =
        new Date(selectedDate + "T23:59:59").getTime();

        const url =
        `/api/plugins/telemetry/DEVICE/${DEVICE_ID}/values/timeseries?keys=chiller_plant_1&startTs=${startTs}&endTs=${endTs}&limit=50000&agg=NONE`;

        const response =
        await fetch(url,{

            method:"GET",

            headers:{
                "X-Authorization":"Bearer " + JWT_TOKEN
            }
        });

        const raw =
        await response.json();

        if(!raw.chiller_plant_1){

            document.getElementById("statusText").innerHTML =
            "No telemetry found";

            return;
        }

        const rows = [];

        raw.chiller_plant_1.forEach(item=>{

            try{

                const data =
                JSON.parse(item.value);

                rows.push({

                    ts:item.ts,

                    pf:Number(data["18_Avg_PF"]),

                    kw:Number(data["18_Act_Power_Total"]),

                    kwh:Number(data["18_Act_Energy_Total"])

                });

            }catch(err){}
        });

        rows.sort((a,b)=>a.ts-b.ts);

        processKPIs(rows);

        renderTrend(rows);

        renderScatter(rows);

        renderEvents(rows);

        document.getElementById("statusText").innerHTML =
        rows.length + " Samples Loaded";

    }catch(err){

        console.error(err);

        document.getElementById("statusText").innerHTML =
        "Error Loading Data";
    }
}

/* =========================================
PROCESS KPI
========================================= */

function processKPIs(rows){

    if(rows.length === 0){
        return;
    }

    const validPF =
    rows.filter(r=>!isNaN(r.pf));

    /* =====================
    AVG PF
    ===================== */

    const avgPF =
    validPF.reduce((sum,r)=>sum + r.pf,0)
    /
    validPF.length;

    document.getElementById("avgPF").innerHTML =
    avgPF.toFixed(2);

    /* =====================
    MIN PF
    ===================== */

    let minPF = 999;

    let minPFTime = "";

    validPF.forEach(r=>{

        if(r.pf < minPF){

            minPF = r.pf;

            minPFTime = formatTime(r.ts);
        }
    });

    document.getElementById("minPF").innerHTML =
    minPF.toFixed(2);

    document.getElementById("minPFTime").innerHTML =
    minPFTime;

    /* =====================
    LOW PF DURATION
    ===================== */

    let lowDuration = 0;

    validPF.forEach(r=>{

        if(r.pf < 0.90){

            lowDuration++;
        }
    });

    document.getElementById("durationPF").innerHTML =
    lowDuration;

    /* =====================
    PENALTY CALCULATION
    ===================== */

    let totalPenalty = 0;

    validPF.forEach(r=>{

        if(r.pf < 0.90){

            totalPenalty +=
            ((0.90 - r.pf) * r.kw * 0.5);
        }
    });

    document.getElementById("penaltyPF").innerHTML =
    "₹ " + totalPenalty.toFixed(0);
}

/* =========================================
PF TREND
========================================= */

function renderTrend(rows){

    Plotly.newPlot("pfTrend",[

        {

            x:rows.map(r=>new Date(r.ts)),

            y:rows.map(r=>r.pf),

            name:"Power Factor",

            mode:"lines",

            line:{
                width:3
            }
        },

        {

            x:rows.map(r=>new Date(r.ts)),

            y:rows.map(r=>r.kw),

            name:"Active Power",

            mode:"lines",

            yaxis:"y2"
        }

    ],{

        paper_bgcolor:"#ffffff",

        plot_bgcolor:"#ffffff",

        margin:{t:20},

        legend:{
            orientation:"h"
        },

        yaxis:{
            title:"PF",
            range:[0,1.2]
        },

        yaxis2:{
            title:"kW",
            overlaying:"y",
            side:"right"
        }

    },{
        responsive:true,
        displaylogo:false
    });
}

/* =========================================
SCATTER
========================================= */

function renderScatter(rows){

    Plotly.newPlot("pfScatter",[{

        x:rows.map(r=>r.kw),

        y:rows.map(r=>r.pf),

        mode:"markers",

        name:"PF vs kW"

    }],{

        paper_bgcolor:"#ffffff",

        plot_bgcolor:"#ffffff",

        margin:{t:20},

        xaxis:{
            title:"Active Power"
        },

        yaxis:{
            title:"PF",
            range:[0,1.2]
        }

    },{
        responsive:true,
        displaylogo:false
    });
}

/* =========================================
EVENT TABLE
========================================= */

function renderEvents(rows){

    const tbody =
    document.getElementById("eventsTable");

    tbody.innerHTML = "";

    const events = [];

    let currentEvent = null;

    rows.forEach((r,index)=>{

        if(r.pf < 0.90){

            if(!currentEvent){

                currentEvent = {

                    start:r.ts,

                    minPF:r.pf,

                    kw:r.kw
                };
            }

            if(r.pf < currentEvent.minPF){

                currentEvent.minPF = r.pf;

                currentEvent.kw = r.kw;
            }

        }else{

            if(currentEvent){

                currentEvent.end =
                rows[index-1]?.ts || r.ts;

                currentEvent.duration =
                Math.round(
                    (currentEvent.end-currentEvent.start)
                    /60000
                );

                events.push(currentEvent);

                currentEvent = null;
            }
        }
    });

    if(events.length === 0){

        tbody.innerHTML =
        `<tr>
            <td colspan="5">
                No Low PF Events
            </td>
        </tr>`;

        return;
    }

    events.forEach(e=>{

        tbody.innerHTML += `

        <tr>

            <td>${formatTime(e.start)}</td>

            <td>${formatTime(e.end)}</td>

            <td>${e.minPF.toFixed(2)}</td>

            <td>${e.kw.toFixed(2)}</td>

            <td>${e.duration} Min</td>

        </tr>
        `;
    });
}

/* =========================================
INITIAL LOAD
========================================= */

loadData();

</script>

</body>
</html>
