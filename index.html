<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PF Analysis</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  background:#f3f4f7;
  font-family:'Segoe UI',sans-serif;
  color:#1f2937;
}

/* MAIN */

.page{
  width:100%;
  padding:8px;
}

/* FILTER BAR */

.filter-row{

  width:100%;

  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;

  background:#ffffff;

  padding:12px 16px;

  border-radius:10px;

  border:1px solid #e5e7eb;

  margin-bottom:10px;
}

.filter-item{
  display:flex;
  align-items:center;
  gap:10px;
}

.filter-item label{
  font-size:13px;
  color:#6b7280;
  font-weight:600;
}

input[type="date"]{

  padding:8px 12px;

  border:1px solid #d1d5db;

  border-radius:8px;

  background:#fff;

  font-size:14px;
}

button{

  border:none;

  border-radius:8px;

  padding:10px 18px;

  cursor:pointer;

  font-size:14px;

  font-weight:700;
}

.primary{

  background:#0b5ed7;

  color:#fff;
}

.primary:hover{
  background:#084298;
}

.status{
  margin-left:auto;
  color:#6b7280;
  font-size:13px;
}

/* KPI SECTION */

.summary-row{

  width:100%;

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:12px;

  margin-bottom:12px;
}

.kpi-card{

  position:relative;

  background:#ffffff;

  border-radius:10px;

  border:1px solid #dfe3e8;

  padding:14px 18px;

  min-height:115px;

  overflow:hidden;
}

.kpi-card::before{

  content:"";

  position:absolute;

  left:0;
  top:0;

  width:4px;
  height:100%;

  background:#10b981;
}

.kpi-card.orange::before{
  background:#f59e0b;
}

.kpi-card.red::before{
  background:#ef4444;
}

.kpi-title{

  font-size:11px;

  letter-spacing:2px;

  color:#94a3b8;

  font-weight:700;

  text-transform:uppercase;

  margin-bottom:10px;
}

.kpi-value{

  font-size:52px;

  line-height:1;

  font-weight:800;

  color:#0f172a;
}

.kpi-unit{

  font-size:18px;

  color:#94a3b8;

  font-weight:600;

  margin-left:4px;
}

.kpi-footer{

  margin-top:12px;

  display:flex;

  align-items:center;

  gap:10px;

  flex-wrap:wrap;
}

.badge{

  background:#dcfce7;

  color:#15803d;

  font-size:11px;

  padding:5px 10px;

  border-radius:6px;

  font-weight:700;
}

.footer-text{

  color:#94a3b8;

  font-size:12px;
}

/* PANELS */

.panel{

  width:100%;

  background:#ffffff;

  border-radius:10px;

  border:1px solid #e5e7eb;

  padding:14px;

  margin-bottom:12px;
}

.panel h3{

  margin:0 0 12px;

  font-size:18px;

  color:#111827;
}

/* TABLE */

.table-wrap{
  width:100%;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

thead th{

  background:#f8fafc;

  color:#334155;

  padding:12px;

  font-size:13px;

  border-bottom:1px solid #e5e7eb;
}

tbody td{

  padding:12px;

  text-align:center;

  border-bottom:1px solid #edf2f7;

  font-size:13px;
}

tbody tr:nth-child(even){
  background:#fafafa;
}

/* RESPONSIVE */

@media(max-width:1200px){

  .summary-row{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:700px){

  .summary-row{
    grid-template-columns:1fr;
  }

  .filter-row{
    flex-direction:column;
    align-items:flex-start;
  }

  .status{
    margin-left:0;
  }
}

</style>
</head>

<body>

<div class="page">

  <!-- FILTER -->

  <div class="filter-row">

    <div class="filter-item">

      <label>🟢 Date</label>

      <input type="date" id="dateInput">

    </div>

    <button class="primary" id="btnGenerate">
      ▶ Analyze
    </button>

    <button class="primary" id="btnExport">
      ⬇ Export
    </button>

    <div class="status" id="status">
      Waiting...
    </div>

  </div>

  <!-- KPI -->

  <div class="summary-row">

    <!-- AVG PF -->

    <div class="kpi-card">

      <div class="kpi-title">
        Average PF
      </div>

      <div>
        <span class="kpi-value" id="kpiAvgPF">0.00</span>
      </div>

      <div class="kpi-footer">

        <div class="badge">
          ✔ NORMAL
        </div>

        <div class="footer-text">
          target 0.95 / ideal 1.0
        </div>

      </div>

    </div>

    <!-- MIN PF -->

    <div class="kpi-card orange">

      <div class="kpi-title">
        Minimum PF
      </div>

      <div>
        <span class="kpi-value" id="kpiMinPF">0.00</span>
      </div>

      <div class="kpi-footer">

        <div class="badge">
          ⚠ LOW
        </div>

        <div class="footer-text" id="kpiMinPFTs">
          --
        </div>

      </div>

    </div>

    <!-- DURATION -->

    <div class="kpi-card">

      <div class="kpi-title">
        Low PF Duration
      </div>

      <div>
        <span class="kpi-value" id="kpiDurationLowPF">0</span>
        <span class="kpi-unit">Min</span>
      </div>

      <div class="kpi-footer">

        <div class="badge">
          ✔ TRACKED
        </div>

        <div class="footer-text">
          PF below 0.90
        </div>

      </div>

    </div>

    <!-- PENALTY -->

    <div class="kpi-card red">

      <div class="kpi-title">
        Estimated Penalty
      </div>

      <div>
        <span class="kpi-value" id="kpiPenalty">0</span>
      </div>

      <div class="kpi-footer">

        <div class="badge">
          ₹ COST
        </div>

        <div class="footer-text">
          estimated utility loss
        </div>

      </div>

    </div>

  </div>

  <!-- TREND -->

  <div class="panel">

    <h3>
      PF Trend With Active Power
    </h3>

    <div id="pfTrend" style="height:430px;"></div>

  </div>

  <!-- SCATTER -->

  <div class="panel">

    <h3>
      PF vs Active Power
    </h3>

    <div id="pfScatter" style="height:430px;"></div>

  </div>

  <!-- TABLE -->

  <div class="panel">

    <h3>
      Low PF Events
    </h3>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>Start</th>
            <th>End</th>
            <th>Min PF</th>
            <th>kW @ Min PF</th>
            <th>Duration (Min)</th>

          </tr>

        </thead>

        <tbody id="eventsBody">

          <tr>
            <td colspan="5">
              No Data
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>

<script>

const CONFIG = {

  API_BASE_URL:"https://plantwiz.pimateck.in/api",

  DEVICE_ID:"1250b550-5bdb-11f0-9b14-15d3b3a473c1",

  LOW_PF_THRESHOLD:0.90
};

const TOKEN =
new URLSearchParams(window.location.search).get("token");

document.getElementById("dateInput").value =
new Date().toISOString().split('T')[0];

document.getElementById("btnGenerate")
.addEventListener("click",generate);

function fmt(ts){

  return new Date(ts).toLocaleString();
}

async function fetchTelemetry(startTs,endTs){

  const url =
`${CONFIG.API_BASE_URL}/plugins/telemetry/DEVICE/${CONFIG.DEVICE_ID}/values/timeseries?keys=chiller_plant_1&startTs=${startTs}&endTs=${endTs}&limit=50000&agg=NONE`;

  const res = await fetch(url,{

    headers:{
      "X-Authorization":"Bearer "+TOKEN
    }
  });

  return await res.json();
}

function mergeSeries(obj){

  const rows = [];

  if(obj.chiller_plant_1){

    obj.chiller_plant_1.forEach(item=>{

      try{

        const data = JSON.parse(item.value);

        rows.push({

          ts:item.ts,

          PF:Number(data["18_Avg_PF"]),

          kW:Number(data["18_Act_Power_Total"]),

          kWh:Number(data["18_Act_Energy_Total"])
        });

      }catch(e){}
    });
  }

  return rows.sort((a,b)=>a.ts-b.ts);
}

function renderKPIs(rows,events){

  const pfVals =
  rows.map(x=>x.PF).filter(x=>!isNaN(x));

  const avg =
  pfVals.reduce((a,b)=>a+b,0) / pfVals.length;

  const min =
  Math.min(...pfVals);

  const minRow =
  rows.find(r=>r.PF === min);

  const duration =
  events.reduce((s,e)=>s+e.duration,0);

  const penalty =
  Math.round(duration * 15);

  document.getElementById("kpiAvgPF").innerText =
  avg.toFixed(2);

  document.getElementById("kpiMinPF").innerText =
  min.toFixed(2);

  document.getElementById("kpiMinPFTs").innerText =
  fmt(minRow.ts);

  document.getElementById("kpiDurationLowPF").innerText =
  duration;

  document.getElementById("kpiPenalty").innerText =
  "₹ "+penalty;
}

function detectEvents(rows){

  const events = [];

  let current = null;

  rows.forEach((r,i)=>{

    if(r.PF < CONFIG.LOW_PF_THRESHOLD){

      if(!current){

        current = {

          start:r.ts,

          minPF:r.PF,

          kw:r.kW
        };
      }

      if(r.PF < current.minPF){

        current.minPF = r.PF;

        current.kw = r.kW;
      }

    }else{

      if(current){

        current.end = rows[i-1]?.ts || r.ts;

        current.duration =
        Math.round((current.end-current.start)/60000);

        events.push(current);

        current = null;
      }
    }
  });

  return events;
}

function renderTrend(rows){

  Plotly.newPlot("pfTrend",[

    {

      x:rows.map(r=>new Date(r.ts)),

      y:rows.map(r=>r.PF),

      name:"PF",

      mode:"lines"
    },

    {

      x:rows.map(r=>new Date(r.ts)),

      y:rows.map(r=>r.kW),

      name:"kW",

      yaxis:"y2",

      mode:"lines"
    }

  ],{

    margin:{t:20},

    paper_bgcolor:"#fff",

    plot_bgcolor:"#fff",

    legend:{
      orientation:"h"
    },

    yaxis:{
      title:"PF",
      range:[0,1.2]
    },

    yaxis2:{
      title:"kW",
      overlaying:"y",
      side:"right"
    }

  },{
    responsive:true,
    displaylogo:false
  });
}

function renderScatter(rows){

  Plotly.newPlot("pfScatter",[{

    x:rows.map(r=>r.kW),

    y:rows.map(r=>r.PF),

    mode:"markers",

    name:"PF vs kW"

  }],{

    margin:{t:20},

    paper_bgcolor:"#fff",

    plot_bgcolor:"#fff",

    xaxis:{
      title:"Active Power"
    },

    yaxis:{
      title:"PF",
      range:[0,1.2]
    }

  },{
    responsive:true,
    displaylogo:false
  });
}

function renderEvents(events){

  const tbody =
  document.getElementById("eventsBody");

  tbody.innerHTML = "";

  if(events.length === 0){

    tbody.innerHTML =
    '<tr><td colspan="5">No Low PF Events</td></tr>';

    return;
  }

  events.forEach(e=>{

    tbody.innerHTML += `

    <tr>

      <td>${fmt(e.start)}</td>

      <td>${fmt(e.end)}</td>

      <td>${e.minPF.toFixed(2)}</td>

      <td>${e.kw.toFixed(2)}</td>

      <td>${e.duration}</td>

    </tr>

    `;
  });
}

async function generate(){

  try{

    document.getElementById("status").innerText =
    "Loading Data...";

    const date =
    document.getElementById("dateInput").value;

    const startTs =
    new Date(date+"T00:00:00").getTime();

    const endTs =
    new Date(date+"T23:59:59").getTime();

    const raw =
    await fetchTelemetry(startTs,endTs);

    const rows =
    mergeSeries(raw);

    const events =
    detectEvents(rows);

    renderKPIs(rows,events);

    renderTrend(rows);

    renderScatter(rows);

    renderEvents(events);

    document.getElementById("status").innerText =
    rows.length + " Samples Loaded";

  }catch(err){

    console.error(err);

    document.getElementById("status").innerText =
    "Error Loading";
  }
}

generate();

</script>

</body>
</html>
