<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Low Power Factor Analysis Report</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI',sans-serif;
  background:#f3f4f6;
  margin:0;
  color:#333;
  width:100%;
  overflow-x:hidden;
}

.page{
  width:100%;
  padding:8px;
}

/* FILTER BAR */

.filter-row{

  width:100%;

  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;

  background:#ffffff;

  padding:12px 16px;

  border-radius:12px;

  box-shadow:0 2px 8px rgba(0,0,0,0.08);

  margin-bottom:10px;
}

.filter-item{
  display:flex;
  align-items:center;
  gap:8px;
}

.filter-item label{
  font-size:14px;
  color:#666;
  font-weight:600;
}

input[type="date"]{

  padding:10px 12px;

  border:1px solid #d0d7de;

  border-radius:8px;

  font-size:14px;

  background:#fff;
}

button{

  padding:10px 18px;

  border:none;

  border-radius:8px;

  font-size:14px;

  font-weight:600;

  cursor:pointer;
}

.primary{
  background:#0b5ed7;
  color:#fff;
}

.primary:hover{
  background:#084298;
}

.status{
  font-size:13px;
  color:#777;
}

/* MAIN CONTAINER */

.report-box{

  width:100%;

  background:#fff;

  border-radius:12px;

  padding:8px;

  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

/* HEADER */

.header{

  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  flex-wrap:wrap;

  gap:12px;

  padding:12px;

  border-bottom:1px solid #e5e7eb;
}

.company{
  font-size:22px;
  font-weight:700;
}

.meta{
  color:#555;
  font-size:14px;
  line-height:1.8;
}

/* KPI SECTION */

.summary-row{

  width:100%;

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:12px;

  margin-top:12px;
}

.kpi{

  background:#fff;

  border-radius:12px;

  padding:18px;

  box-shadow:0 2px 8px rgba(0,0,0,.08);

  min-height:120px;
}

.kpi .title{
  color:#666;
  font-size:14px;
  margin-bottom:10px;
}

.kpi .value{
  font-size:32px;
  font-weight:800;
}

.kpi .sub{
  color:#666;
  margin-top:6px;
}

.kpi.danger{
  background:#ffe5e5;
}

/* PANELS */

.panel{

  width:100%;

  background:#fff;

  border-radius:12px;

  padding:14px;

  margin-top:12px;

  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.panel h3{
  margin:0 0 12px;
  font-size:18px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

/* TABLE */

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{

  padding:12px;

  border-bottom:1px solid #ececec;

  text-align:center;
}

thead th{

  background:#ffd54f;

  color:#222;

  font-weight:700;
}

tbody tr:nth-child(even){
  background:#fafafa;
}

/* CHARTS */

#pfTrend,
#pfScatter{
  width:100% !important;
}

/* RESPONSIVE */

@media(max-width:1200px){

  .summary-row{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:700px){

  .summary-row{
    grid-template-columns:1fr;
  }

  .filter-row{
    flex-direction:column;
    align-items:flex-start;
  }
}

</style>
</head>

<body>

<div class="page">

  <!-- FILTER BAR -->

  <div class="filter-row">

    <div class="filter-item">
      <label>Date</label>
      <input type="date" id="dateInput">
    </div>

    <button class="primary" id="btnGenerate">
      ▶ Analyze
    </button>

    <button class="primary" id="btnExport">
      Export PDF
    </button>

    <span class="status" id="status">
      Idle
    </span>

  </div>

  <!-- REPORT -->

  <div class="report-box">

    <!-- HEADER -->

    <div class="header">

      <div>
        <div class="company">
          PlantWiz PF Analysis Report
        </div>

        <div>
          Chiller Plant Analysis Dashboard
        </div>
      </div>

      <div class="meta">

        <div>
          <b>Device:</b>
          <span id="deviceShown"></span>
        </div>

        <div>
          <b>Generated:</b>
          <span id="generatedAt"></span>
        </div>

      </div>

    </div>

    <!-- KPI -->

    <div class="summary-row">

      <div class="kpi">

        <div class="title">
          Avg PF
        </div>

        <div class="value" id="kpiAvgPF">
          --
        </div>

      </div>

      <div class="kpi">

        <div class="title">
          Min PF
        </div>

        <div class="value" id="kpiMinPF">
          --
        </div>

        <div class="sub" id="kpiMinPFTs">
          --
        </div>

      </div>

      <div class="kpi">

        <div class="title">
          Duration PF &lt; 0.90
        </div>

        <div class="value" id="kpiDurationLowPF">
          --
        </div>

      </div>

      <div class="kpi danger">

        <div class="title">
          Estimated Penalty
        </div>

        <div class="value" id="kpiPenalty">
          --
        </div>

      </div>

    </div>

    <!-- TREND -->

    <div class="panel">

      <h3>
        PF Trend With Active Power
      </h3>

      <div id="pfTrend" style="height:420px;"></div>

    </div>

    <!-- SCATTER -->

    <div class="panel">

      <h3>
        PF vs Active Power
      </h3>

      <div id="pfScatter" style="height:420px;"></div>

    </div>

    <!-- EVENTS -->

    <div class="panel">

      <h3>
        Low PF Events
      </h3>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>Start</th>
              <th>End</th>
              <th>Min PF</th>
              <th>kW @ Min PF</th>
              <th>Duration (Min)</th>

            </tr>

          </thead>

          <tbody id="eventsBody">

            <tr>
              <td colspan="5">
                Click Analyze
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>

<script>

const CONFIG = {

  API_BASE_URL:"https://plantwiz.pimateck.in/api",

  LOW_PF_THRESHOLD:0.90,

  PF_TARGET:0.95,

  DEMAND_RATE_INR_PER_KVA:350,

  DEVICE_ID:"1250b550-5bdb-11f0-9b14-15d3b3a473c1"
};

const TOKEN =
new URLSearchParams(window.location.search).get("token");

document.getElementById("deviceShown").innerText =
CONFIG.DEVICE_ID;

document.getElementById("generatedAt").innerText =
new Date().toLocaleString();

const today = new Date();

document.getElementById("dateInput").value =
today.toISOString().split('T')[0];

document.getElementById("btnGenerate")
.addEventListener("click",generate);

function fmtTs(ts){

  return new Date(ts).toLocaleString();
}

function num(v){

  const n = Number(v);

  return Number.isFinite(n) ? n : NaN;
}

async function fetchTelemetry(startTs,endTs){

  const url =
`${CONFIG.API_BASE_URL}/plugins/telemetry/DEVICE/${CONFIG.DEVICE_ID}/values/timeseries?keys=chiller_plant_1&startTs=${startTs}&endTs=${endTs}&limit=50000&agg=NONE`;

  const res = await fetch(url,{

    headers:{
      "X-Authorization":"Bearer "+TOKEN
    }
  });

  return res.json();
}

function mergeSeries(obj){

  const map = new Map();

  Object.entries(obj).forEach(([k,arr])=>{

    (arr || []).forEach(p=>{

      const t = +p.ts;

      const row =
      map.get(t) || {ts:t};

      row[k] = p.value;

      map.set(t,row);
    });
  });

  return Array
  .from(map.values())
  .sort((a,b)=>a.ts-b.ts);
}

function detectLowPFEvents(rows){

  const events = [];

  let cur = null;

  rows.forEach((r,i)=>{

    const low =
    r.PF < CONFIG.LOW_PF_THRESHOLD;

    if(low && !cur){

      cur = {

        start:r.ts,

        minPF:r.PF,

        kw:r.kW
      };
    }

    if(low && cur && r.PF < cur.minPF){

      cur.minPF = r.PF;

      cur.kw = r.kW;
    }

    if(!low && cur){

      cur.end = rows[i-1]?.ts || r.ts;

      cur.duration =
      Math.round(
        (cur.end - cur.start)/60000
      );

      events.push(cur);

      cur = null;
    }
  });

  return events;
}

function renderKPIs(rows,events){

  const pfValues =
  rows.map(r=>r.PF).filter(v=>!isNaN(v));

  const avg =
  pfValues.reduce((a,b)=>a+b,0) /
  pfValues.length;

  const min =
  Math.min(...pfValues);

  const minRow =
  rows.find(r=>r.PF === min);

  const duration =
  events.reduce((s,e)=>s+e.duration,0);

  const penalty =
  Math.round(duration * 15);

  document.getElementById("kpiAvgPF").innerText =
  avg.toFixed(2);

  document.getElementById("kpiMinPF").innerText =
  min.toFixed(2);

  document.getElementById("kpiMinPFTs").innerText =
  fmtTs(minRow.ts);

  document.getElementById("kpiDurationLowPF").innerText =
  duration + " Min";

  document.getElementById("kpiPenalty").innerText =
  "₹ " + penalty;
}

function renderTrend(rows){

  Plotly.newPlot("pfTrend",[

    {

      x:rows.map(r=>new Date(r.ts)),

      y:rows.map(r=>r.PF),

      name:"PF",

      mode:"lines"
    },

    {

      x:rows.map(r=>new Date(r.ts)),

      y:rows.map(r=>r.kW),

      name:"kW",

      yaxis:"y2",

      mode:"lines"
    }

  ],{

    margin:{t:20},

    yaxis:{
      title:"PF",
      range:[0,1.5]
    },

    yaxis2:{
      title:"kW",
      overlaying:"y",
      side:"right"
    },

    legend:{
      orientation:"h"
    }

  },{

    responsive:true,
    displaylogo:false
  });
}

function renderScatter(rows){

  Plotly.newPlot("pfScatter",[{

    x:rows.map(r=>r.kW),

    y:rows.map(r=>r.PF),

    mode:"markers",

    name:"PF vs kW"

  }],{

    margin:{t:20},

    xaxis:{
      title:"Active Power (kW)"
    },

    yaxis:{
      title:"PF",
      range:[0,1.5]
    }

  },{
    responsive:true,
    displaylogo:false
  });
}

function renderEvents(events){

  const tbody =
  document.getElementById("eventsBody");

  tbody.innerHTML = "";

  if(events.length === 0){

    tbody.innerHTML =
    '<tr><td colspan="5">No Low PF Events</td></tr>';

    return;
  }

  events.forEach(e=>{

    tbody.innerHTML += `

    <tr>

      <td>${fmtTs(e.start)}</td>

      <td>${fmtTs(e.end)}</td>

      <td>${e.minPF.toFixed(2)}</td>

      <td>${e.kw.toFixed(1)}</td>

      <td>${e.duration}</td>

    </tr>

    `;
  });
}

async function generate(){

  try{

    document.getElementById("status").innerText =
    "Fetching Data...";

    const date =
    document.getElementById("dateInput").value;

    const start =
    new Date(date+"T00:00:00").getTime();

    const end =
    new Date(date+"T23:59:59").getTime();

    const raw =
    await fetchTelemetry(start,end);

    const rows =
    mergeSeries(raw).map(r=>{

      let p = {};

      try{

        p = JSON.parse(r.chiller_plant_1);

      }catch(e){}

      return {

        ts:r.ts,

        PF:num(p["18_Avg_PF"]),

        kW:num(p["18_Act_Power_Total"]),

        Energy:num(p["18_Act_Energy_Total"])
      };
    });

    const events =
    detectLowPFEvents(rows);

    renderKPIs(rows,events);

    renderTrend(rows);

    renderScatter(rows);

    renderEvents(events);

    document.getElementById("status").innerText =
    "Completed";

  }catch(err){

    console.error(err);

    document.getElementById("status").innerText =
    "Error";
  }
}

generate();

</script>

</body>
</html>
